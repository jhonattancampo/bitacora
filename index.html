<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0E1316">
<meta name="description" content="Registro de entrenamiento: rutinas, series, descansos y progreso.">
<title>Bitácora · Entrenamiento</title>

<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./app.css">
</head>
<body>

<div id="app"></div>
<div id="timer"><div class="tbar">
  <div class="tfill" id="tfill"></div>
  <div class="tinner">
    <div class="tnum mono" id="tnum">0:00</div>
    <div class="grow"><div class="tlbl" id="tlbl">Descanso</div></div>
    <button class="btn sm" data-act="t-add">+15</button>
    <button class="btn sm" data-act="t-sub">−15</button>
    <button class="btn sm primary" data-act="t-skip">Listo</button>
  </div>
</div></div>

<nav><div class="navin">
  <button class="nb" data-act="nav" data-v="train"><svg viewBox="0 0 24 24"><path d="M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12"/></svg>Entrenar</button>
  <button class="nb" data-act="nav" data-v="routines"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/><circle cx="19" cy="19" r="2"/></svg>Rutinas</button>
  <button class="nb" data-act="nav" data-v="exercises"><svg viewBox="0 0 24 24"><path d="M12 3v18M5 8l7-5 7 5M5 16l7 5 7-5"/></svg>Ejercicios</button>
  <button class="nb" data-act="nav" data-v="progress"><svg viewBox="0 0 24 24"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>Progreso</button>
  <button class="nb" data-act="nav" data-v="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>Ajustes</button>
</div></nav>

<div id="scrim" data-act="closesheet"></div>
<div id="sheet"><div class="handle"></div><div class="sheetin" id="sheetin"></div></div>
<div id="toast"></div>
<div id="lock">
  <div class="lockcard">
    <div class="mark" style="margin:0 auto 14px"></div>
    <div class="h2" id="lockTitle" style="text-align:center">Ingresá tu PIN</div>
    <div id="lockMsg" class="tiny dim" style="text-align:center;margin-top:4px;min-height:16px"></div>
    <input type="password" id="lockInput" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" style="text-align:center;letter-spacing:.4em;font-size:22px;margin-top:16px">
    <button class="btn block primary" id="lockGo" style="margin-top:12px">Continuar</button>
  </div>
</div>
<script src="./config.js"></script>
<script src="./sync.js"></script>
<script src="./app.js"></script>
</body>
</html>
